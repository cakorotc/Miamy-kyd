<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Meridian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.5" stop-color="#0d1425"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="988" height="328" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="988" height="328" rx="30" fill="url(#dots)"/>
  <circle cx="900" cy="40" r="150" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="90" cy="320" r="140" fill="#818cf8" fill-opacity="0.08" filter="url(#glow)"/>

  <line x1="40" y1="60" x2="150" y2="60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="850" y1="290" x2="960" y2="290" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <g>
    <rect x="80" y="111" width="118" height="118" rx="28" fill="url(#accent)"/>
    <g transform="translate(139 170)" fill="none" stroke="#0a0f1e">
      <circle cx="0" cy="0" r="34" stroke-width="7"/>
      <ellipse cx="0" cy="0" rx="15" ry="34" stroke-width="5.5"/>
    </g>
  </g>

  <text x="232" y="165" font-size="88" font-weight="800" letter-spacing="-3" fill="#ffffff">Meridian</text>
  <text x="236" y="205" font-size="20" font-weight="700" letter-spacing="1.2" fill="#8fa0bd">XRAY-CORE VPN MANAGEMENT PANEL</text>

  <g font-size="15" font-weight="700" letter-spacing="1">
    <rect x="232" y="232" width="92" height="34" rx="17" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="278" y="254" text-anchor="middle" fill="#38bdf8">VLESS</text>
    <rect x="336" y="232" width="100" height="34" rx="17" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="386" y="254" text-anchor="middle" fill="#818cf8">VMESS</text>
    <rect x="448" y="232" width="100" height="34" rx="17" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="498" y="254" text-anchor="middle" fill="#34d399">TROJAN</text>
  </g>
</svg>
